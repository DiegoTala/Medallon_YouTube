[project]
name = "medallon-youtube"
version = "0.1.0"
description = "YouTube DJ Analytics — pipeline medallón serverless en GCP + agente RAG conversacional"
requires-python = ">=3.12"
dependencies = [
    # Fase 1 — pipeline
    "google-api-python-client>=2.140",
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.25",
    "google-cloud-secret-manager>=2.20",
    "pydantic>=2.8",
    # Fase 2 — agente RAG
    "google-adk>=2.6",
    "google-cloud-firestore>=2.20",
    "google-auth>=2.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
