[project]
name = "medallon-youtube"
version = "0.1.0"
description = "YouTube DJ Analytics — pipeline medallon serverless en GCP"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.140",
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.25",
    "google-cloud-secret-manager>=2.20",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
