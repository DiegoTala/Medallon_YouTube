<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube DJ Analytics</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1>YouTube DJ Analytics</h1>
                <p class="subtitle">Consulta comentarios y tendencias de DJs en YouTube</p>
            </div>
            <div class="header-actions">
                <div class="quota-display">
                    <!-- El número real llega de /welcome al cargar; este texto
                         es solo el estado mientras responde. Antes decía
                         "0/30" fijo y parecía que la cuota se reiniciaba en
                         cada refresh. -->
                    <span id="quota-text">Consultas hoy: —</span>
                </div>
                <!-- Cierra la sesión de IAP para ESTA app. No cierra la
                     sesión de Google: si sigue viva, IAP reautentica en
                     silencio al volver a entrar, y eso es correcto aunque
                     parezca que no funcionó.
                     La pantalla de confirmación la sirve IAP, no nosotros —
                     cualquier página propia está detrás de IAP y pedirla
                     volvería a disparar el login. -->
                <a class="logout-link" href="/?gcp-iap-mode=CLEAR_LOGIN_COOKIE"
                   title="Cierra la sesión de esta aplicación">Cerrar sesión</a>
            </div>
        </header>

        <main class="chat-container">
            <div id="messages" class="messages">
                <!-- La bienvenida la arma app.js con lo que devuelve
                     /welcome: el saludo, las capacidades y los DJs que
                     realmente tienen comentarios en el corpus. -->
                <div id="welcome" class="message system" hidden></div>
            </div>
        </main>

        <form id="chat-form" class="input-form">
            <div class="input-wrapper">
                <textarea
                    id="query-input"
                    placeholder="Ejemplo: ¿Qué opinan de los drops de Martin Garrix?"
                    rows="1"
                    maxlength="500"
                ></textarea>
                <button type="submit" id="send-btn" aria-label="Enviar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <p class="input-hint">Máximo 500 caracteres · Enter para enviar, Shift+Enter para nueva línea</p>
        </form>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
